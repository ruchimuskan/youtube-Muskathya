name: Daily YouTube (IST)

on:
  schedule:
    # 3:00 PM IST — generate + upload or queue
    - cron: "30 9 * * *"
    # 6:00 PM IST — publish any queued uploads when quota allows
    - cron: "30 12 * * *"
  repository_dispatch:
    types: [daily_pipeline, upload_queue]
  workflow_dispatch:
    inputs:
      job:
        description: Which job to run
        type: choice
        options:
          - pipeline
          - upload_queue
        default: pipeline

env:
  TIMEZONE: Asia/Kolkata
  PUBLISHING_MODE: schedule

jobs:
  pipeline:
    timeout-minutes: 240
    env:
      PIPELINE_GENERATE: "true"
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
    if: >-
      github.event.schedule == '30 9 * * *' ||
      (github.event_name == 'workflow_dispatch' && github.event.inputs.job == 'pipeline') ||
      (github.event_name == 'repository_dispatch' && github.event.action == 'daily_pipeline')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Daily cache key (IST)
        id: cachekey
        run: echo "key=pipeline-$(TZ=Asia/Kolkata date +%Y%m%d)" >> "$GITHUB_OUTPUT"

      - name: Restore pipeline data cache
        uses: actions/cache@v4
        with:
          path: |
            data
            output
          key: ${{ steps.cachekey.outputs.key }}

      - name: Materialize OAuth (no Mac)
        env:
          GOOGLE_CLIENT_SECRETS_JSON: ${{ secrets.GOOGLE_CLIENT_SECRETS_JSON }}
          YOUTUBE_OAUTH_TOKENS_JSON: ${{ secrets.YOUTUBE_OAUTH_TOKENS_JSON }}
        run: bash scripts/ci/materialize_oauth.sh

      - name: System deps (ffmpeg, piper voice)
        run: bash scripts/ci/install_cloud_deps.sh

      - name: Python deps
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: |
          python -m venv .venv
          source .venv/bin/activate
          pip install -q -r requirements.txt
          pip install -q onnxruntime
          bash scripts/ci/verify_ci_stack.sh

      - name: Preflight
        run: bash scripts/preflight_automation.sh

      - name: Run daily generate + upload
        run: |
          source .venv/bin/activate
          python -m app.main init-db
          python -m app.main upload-queue || true
          python -m app.main generate --upload --idempotency-key "gha-daily-${{ github.run_id }}"
        env:
          AI_PROVIDER: cloudflare
          CLOUDFLARE_IMAGE_ENABLED: "true"
          COMFYUI_ENABLED: "false"
          ALLOW_PLACEHOLDER_IMAGES: "false"
          EMERGENCY_STOP: ${{ vars.EMERGENCY_STOP || 'false' }}
          TIMEZONE: Asia/Kolkata
          PUBLISHING_MODE: schedule
          PIPER_LENGTH_SCALE: "1.38"

  upload_queue:
    timeout-minutes: 45
    if: >-
      github.event.schedule == '30 12 * * *' ||
      (github.event_name == 'workflow_dispatch' && github.event.inputs.job == 'upload_queue') ||
      (github.event_name == 'repository_dispatch' && github.event.action == 'upload_queue')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Daily cache key (IST)
        id: cachekey
        run: echo "key=pipeline-$(TZ=Asia/Kolkata date +%Y%m%d)" >> "$GITHUB_OUTPUT"

      - name: Restore pipeline data cache
        uses: actions/cache@v4
        with:
          path: |
            data
            output
          key: ${{ steps.cachekey.outputs.key }}

      - name: Materialize OAuth
        env:
          GOOGLE_CLIENT_SECRETS_JSON: ${{ secrets.GOOGLE_CLIENT_SECRETS_JSON }}
          YOUTUBE_OAUTH_TOKENS_JSON: ${{ secrets.YOUTUBE_OAUTH_TOKENS_JSON }}
        run: bash scripts/ci/materialize_oauth.sh

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: |
          python -m venv .venv
          source .venv/bin/activate
          pip install -q -r requirements.txt

      - name: Preflight
        run: bash scripts/preflight_automation.sh

      - name: Process deferred uploads (6 PM IST)
        run: |
          source .venv/bin/activate
          python -m app.main init-db
          python -m app.main upload-queue
        env:
          EMERGENCY_STOP: ${{ vars.EMERGENCY_STOP || 'false' }}
          TIMEZONE: Asia/Kolkata
          PIPER_LENGTH_SCALE: "1.38"
