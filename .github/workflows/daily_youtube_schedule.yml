name: Daily YouTube (IST)

# Triggered accurately at 3:00 PM IST and 6:00 PM IST by cron-job.org via repository_dispatch.
# GitHub native 'schedule' is commented out because GitHub-hosted runners delay cron by 5-7 hours
# causing duplicate ghost runs late at night (e.g. at 21:26 and 23:50 IST).
on:
  # schedule:
  #   - cron: "30 9 * * *"   # 3:00 PM IST (delayed on free GitHub runners)
  #   - cron: "30 12 * * *"  # 6:00 PM IST (delayed on free GitHub runners)
  repository_dispatch:
    types: [daily_pipeline, upload_queue]
  workflow_dispatch:
    inputs:
      job:
        description: Which job to run
        type: choice
        options:
          - pipeline
          - upload_queue
        default: pipeline

env:
  TIMEZONE: Asia/Kolkata
  PUBLISHING_MODE: schedule

jobs:
  pipeline:
    timeout-minutes: 120
    env:
      PIPELINE_GENERATE: "true"
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
    if: >-
      github.event.schedule == '30 9 * * *' ||
      (github.event_name == 'workflow_dispatch' && github.event.inputs.job == 'pipeline') ||
      (github.event_name == 'repository_dispatch' && github.event.action == 'daily_pipeline')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Daily cache key (IST)
        id: cachekey
        run: echo "key=pipeline-$(TZ=Asia/Kolkata date +%Y%m%d)" >> "$GITHUB_OUTPUT"

      - name: Restore pipeline data cache
        uses: actions/cache@v4
        with:
          path: |
            data
            output
          key: ${{ steps.cachekey.outputs.key }}

      - name: Materialize OAuth (no Mac)
        env:
          GOOGLE_CLIENT_SECRETS_JSON: ${{ secrets.GOOGLE_CLIENT_SECRETS_JSON }}
          YOUTUBE_OAUTH_TOKENS_JSON: ${{ secrets.YOUTUBE_OAUTH_TOKENS_JSON }}
        run: bash scripts/ci/materialize_oauth.sh

      - name: System deps (ffmpeg, piper voice)
        run: bash scripts/ci/install_cloud_deps.sh

      - name: Python deps
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: |
          python -m venv .venv
          source .venv/bin/activate
          pip install -q -r requirements.txt
          pip install -q onnxruntime
          bash scripts/ci/verify_ci_stack.sh

      - name: Preflight
        run: bash scripts/preflight_automation.sh

      - name: Run daily generate + upload
        run: |
          source .venv/bin/activate
          python -m app.main init-db
          python -m app.main upload-queue || true
          python -m app.main generate --upload --idempotency-key "gha-daily-${{ github.run_id }}" 2>&1 | tee /tmp/pipeline_output.log
          EXIT_CODE=${PIPESTATUS[0]}
          echo "=== PIPELINE EXIT CODE: $EXIT_CODE ==="
          if [[ $EXIT_CODE -ne 0 ]]; then
            echo "=== LAST 60 LINES OF OUTPUT ==="
            tail -60 /tmp/pipeline_output.log
            exit $EXIT_CODE
          fi
        env:
          AI_PROVIDER: cloudflare
          CLOUDFLARE_IMAGE_ENABLED: "true"
          COMFYUI_ENABLED: "false"
          ALLOW_PLACEHOLDER_IMAGES: "true"
          EMERGENCY_STOP: ${{ vars.EMERGENCY_STOP || 'false' }}
          TIMEZONE: Asia/Kolkata
          PUBLISHING_MODE: schedule
          PIPER_LENGTH_SCALE: "1.08"
          VIDEO_MIN_DURATION_SEC: "480"
          VIDEO_MAX_DURATION_SEC: "780"

      - name: Save pipeline cache on success
        if: success()
        uses: actions/cache/save@v4
        with:
          path: |
            data
            output
          key: ${{ steps.cachekey.outputs.key }}

      - name: Auto-retry on failure (via dispatch)
        if: failure()
        env:
          GH_DISPATCH_PAT: ${{ secrets.GH_DISPATCH_PAT }}
        run: |
          if [[ -n "$GH_DISPATCH_PAT" ]]; then
            echo "Pipeline failed — scheduling auto-retry in 10 min..."
            sleep 600
            curl -s -X POST \
              -H "Authorization: Bearer $GH_DISPATCH_PAT" \
              -H "Accept: application/vnd.github+json" \
              https://api.github.com/repos/${{ github.repository }}/dispatches \
              -d '{"event_type":"daily_pipeline"}' && echo "Retry dispatched." || echo "Retry dispatch failed."
          else
            echo "GH_DISPATCH_PAT not set — skipping auto-retry. Set it in GitHub Secrets."
          fi

  upload_queue:
    timeout-minutes: 45
    if: >-
      github.event.schedule == '30 12 * * *' ||
      (github.event_name == 'workflow_dispatch' && github.event.inputs.job == 'upload_queue') ||
      (github.event_name == 'repository_dispatch' && github.event.action == 'upload_queue')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Daily cache key (IST)
        id: cachekey
        run: echo "key=pipeline-$(TZ=Asia/Kolkata date +%Y%m%d)" >> "$GITHUB_OUTPUT"

      - name: Restore pipeline data cache
        uses: actions/cache@v4
        with:
          path: |
            data
            output
          key: ${{ steps.cachekey.outputs.key }}

      - name: Materialize OAuth
        env:
          GOOGLE_CLIENT_SECRETS_JSON: ${{ secrets.GOOGLE_CLIENT_SECRETS_JSON }}
          YOUTUBE_OAUTH_TOKENS_JSON: ${{ secrets.YOUTUBE_OAUTH_TOKENS_JSON }}
        run: bash scripts/ci/materialize_oauth.sh

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: |
          python -m venv .venv
          source .venv/bin/activate
          pip install -q -r requirements.txt

      - name: Preflight
        run: bash scripts/preflight_automation.sh

      - name: Process deferred uploads (6 PM IST)
        run: |
          source .venv/bin/activate
          python -m app.main init-db
          python -m app.main upload-queue
        env:
          EMERGENCY_STOP: ${{ vars.EMERGENCY_STOP || 'false' }}
          TIMEZONE: Asia/Kolkata
          PIPER_LENGTH_SCALE: "1.38"

