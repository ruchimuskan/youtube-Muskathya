name: Generate YouTube Video

on:
  workflow_dispatch:
    inputs:
      upload:
        description: Upload after generation (respects privacy settings)
        required: false
        default: "false"
      idempotency_key:
        description: Optional idempotency key
        required: false
        default: ""
  repository_dispatch:
    types: [generate_youtube_video]

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Materialize OAuth
        env:
          GOOGLE_CLIENT_SECRETS_JSON: ${{ secrets.GOOGLE_CLIENT_SECRETS_JSON }}
          YOUTUBE_OAUTH_TOKENS_JSON: ${{ secrets.YOUTUBE_OAUTH_TOKENS_JSON }}
        run: bash scripts/ci/materialize_oauth.sh

      - name: System deps
        run: bash scripts/ci/install_cloud_deps.sh

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m venv .venv
          source .venv/bin/activate
          pip install -r requirements.txt

      - name: Preflight
        run: bash scripts/preflight_automation.sh

      - name: Initialize database
        run: |
          source .venv/bin/activate
          python -m app.main init-db
        env:
          DATABASE_URL: sqlite:///./data/channel_manager.db

      - name: Run pipeline
        run: |
          source .venv/bin/activate
          UPLOAD_FLAG=""
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ "${{ inputs.upload }}" = "true" ]; then
            UPLOAD_FLAG="--upload"
          fi
          if [ "${{ github.event_name }}" = "repository_dispatch" ] && [ "${{ github.event.client_payload.upload }}" = "true" ]; then
            UPLOAD_FLAG="--upload"
          fi
          KEY="${{ inputs.idempotency_key }}"
          if [ "${{ github.event_name }}" = "repository_dispatch" ]; then
            KEY="${{ github.event.client_payload.idempotency_key }}"
          fi
          EXTRA=""
          if [ -n "$KEY" ]; then
            EXTRA="--idempotency-key $KEY"
          fi
          python -m app.main generate $UPLOAD_FLAG $EXTRA
        env:
          AI_PROVIDER: cloudflare
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_IMAGE_ENABLED: "true"
          COMFYUI_ENABLED: "false"
          EMERGENCY_STOP: ${{ vars.EMERGENCY_STOP || 'false' }}
