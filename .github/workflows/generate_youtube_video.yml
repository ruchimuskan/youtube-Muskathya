name: Generate YouTube Video

on:
  workflow_dispatch:
    inputs:
      upload:
        description: Upload after generation (respects privacy settings)
        required: false
        default: "false"
      idempotency_key:
        description: Optional idempotency key
        required: false
        default: ""
  repository_dispatch:
    types: [generate_youtube_video]

jobs:
  generate:
    runs-on: [self-hosted, macOS, youtube-ai]
    steps:
      - uses: actions/checkout@v4
        with:
          clean: false

      - name: Load .env
        run: |
          if [ -f .env ]; then set -a && source .env && set +a; fi

      - name: Preflight
        run: bash scripts/preflight_automation.sh

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m venv .venv
          source .venv/bin/activate
          pip install -r requirements.txt

      - name: Initialize database
        run: |
          source .venv/bin/activate
          python -m app.main init-db
        env:
          DATABASE_URL: sqlite:///./data/channel_manager.db

      - name: Run pipeline
        run: |
          source .venv/bin/activate
          UPLOAD_FLAG=""
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ "${{ inputs.upload }}" = "true" ]; then
            UPLOAD_FLAG="--upload"
          fi
          if [ "${{ github.event_name }}" = "repository_dispatch" ] && [ "${{ github.event.client_payload.upload }}" = "true" ]; then
            UPLOAD_FLAG="--upload"
          fi
          KEY="${{ inputs.idempotency_key }}"
          if [ "${{ github.event_name }}" = "repository_dispatch" ]; then
            KEY="${{ github.event.client_payload.idempotency_key }}"
          fi
          EXTRA=""
          if [ -n "$KEY" ]; then
            EXTRA="--idempotency-key $KEY"
          fi
          python -m app.main generate $UPLOAD_FLAG $EXTRA
        env:
          AI_PROVIDER: ${{ secrets.AI_PROVIDER }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          OLLAMA_BASE_URL: http://127.0.0.1:11434
          EMERGENCY_STOP: ${{ vars.EMERGENCY_STOP || 'false' }}
